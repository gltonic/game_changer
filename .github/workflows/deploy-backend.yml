name: Deploy Backend to VPS

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (Password Auth)
        if: "${{ secrets.VPS_SSH_KEY == '' }}"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "🚀 Starting backend deployment..."
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:$HOME/.local/bin

            echo "🔍 Environment info:"
            echo "User: $(whoami)"
            echo "Node: $(node -v 2>/dev/null || echo 'not found in PATH')"
            echo "PM2: $(pm2 -v 2>/dev/null || echo 'not found in PATH')"

            TARGET_DIR="${{ secrets.VPS_PROJECT_DIR }}"
            if [ -z "$TARGET_DIR" ]; then
              if [ -d "$HOME/game_changer" ]; then
                TARGET_DIR="$HOME/game_changer"
              elif [ -d "$HOME/game_changer_tg_mini_apps" ]; then
                TARGET_DIR="$HOME/game_changer_tg_mini_apps"
              elif [ -d "/var/www/game_changer" ]; then
                TARGET_DIR="/var/www/game_changer"
              else
                TARGET_DIR="$PWD"
              fi
            fi

            echo "📁 Entering project directory: $TARGET_DIR"
            cd "$TARGET_DIR" || exit 1
            git pull origin main

            echo "📦 Updating backend dependencies..."
            cd backend || exit 1
            npm install

            APP_NAME="${{ secrets.PM2_APP_NAME || 'bot' }}"
            echo "🔄 Restarting PM2 process: $APP_NAME..."
            pm2 restart "$APP_NAME" || pm2 start npm --name "$APP_NAME" -- start

            echo "✅ Backend deployment complete!"

      - name: Deploy via SSH (Key Auth)
        if: "${{ secrets.VPS_SSH_KEY != '' }}"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "🚀 Starting backend deployment..."
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:$HOME/.local/bin

            echo "🔍 Environment info:"
            echo "User: $(whoami)"
            echo "Node: $(node -v 2>/dev/null || echo 'not found in PATH')"
            echo "PM2: $(pm2 -v 2>/dev/null || echo 'not found in PATH')"

            TARGET_DIR="${{ secrets.VPS_PROJECT_DIR }}"
            if [ -z "$TARGET_DIR" ]; then
              if [ -d "$HOME/game_changer" ]; then
                TARGET_DIR="$HOME/game_changer"
              elif [ -d "$HOME/game_changer_tg_mini_apps" ]; then
                TARGET_DIR="$HOME/game_changer_tg_mini_apps"
              elif [ -d "/var/www/game_changer" ]; then
                TARGET_DIR="/var/www/game_changer"
              else
                TARGET_DIR="$PWD"
              fi
            fi

            echo "📁 Entering project directory: $TARGET_DIR"
            cd "$TARGET_DIR" || exit 1
            git pull origin main

            echo "📦 Updating backend dependencies..."
            cd backend || exit 1
            npm install

            APP_NAME="${{ secrets.PM2_APP_NAME || 'bot' }}"
            echo "🔄 Restarting PM2 process: $APP_NAME..."
            pm2 restart "$APP_NAME" || pm2 start npm --name "$APP_NAME" -- start

            echo "✅ Backend deployment complete!"

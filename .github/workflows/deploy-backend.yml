name: Deploy Backend to VPS

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "🚀 Starting backend deployment..."
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:$HOME/.local/bin

            echo "🔍 Environment info:"
            echo "User: $(whoami)"
            echo "Node: $(node -v 2>/dev/null || echo 'not found')"
            echo "PM2: $(pm2 -v 2>/dev/null || echo 'not found')"

            # 1. Проверяем наличие git и устанавливаем, если отсутствует
            if ! command -v git &> /dev/null; then
              echo "⚠️ Git не найден на сервере. Устанавливаем git..."
              (apt-get update -y && apt-get install -y git) || (sudo apt-get update -y && sudo apt-get install -y git)
            fi

            # 2. Определение рабочей папки проекта
            TARGET_DIR="${{ secrets.VPS_PROJECT_DIR }}"
            if [ -z "$TARGET_DIR" ]; then
              if [ -d "$HOME/game_changer" ]; then
                TARGET_DIR="$HOME/game_changer"
              elif [ -d "$HOME/game_changer_tg_mini_apps" ]; then
                TARGET_DIR="$HOME/game_changer_tg_mini_apps"
              elif [ -d "/var/www/game_changer" ]; then
                TARGET_DIR="/var/www/game_changer"
              else
                TARGET_DIR="$PWD"
              fi
            fi

            echo "📁 Entering project directory: $TARGET_DIR"
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR" || exit 1

            # 3. Синхронизация репозитория
            if [ -d ".git" ]; then
              echo "🔄 Pulling latest changes from git..."
              git fetch origin main
              git reset --hard origin/main
            else
              echo "⚠️ Git-репозиторий не инициализирован. Клонируем проект..."
              git clone https://github.com/gltonic/game_changer.git temp_repo
              cp -r temp_repo/. .
              rm -rf temp_repo
            fi

            # 4. Переходим в папку backend
            if [ -d "backend" ]; then
              echo "📁 Переходим в подпапку backend..."
              cd backend || exit 1
            fi

            # 5. Создаем/обновляем .env файл
            echo "⚙️ Запись файла конфигурации .env..."
            cat << 'EOF' > .env
            TELEGRAM_BOT_TOKEN=8416333905:AAFkz4luIGu1evvFEJhQZuCVW-4LwlO1WwY
            SUPABASE_URL=https://uhowccknbtavymbygksz.supabase.co
            SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVob3djY2tuYnRhdnltYnlna3N6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MTExMzY0MCwiZXhwIjoyMTA2Njg5NjQwfQ.gFuVFP3SNBdEFyhyWXitjFM9OjiV4IUiZQp3egIjY60
            MINI_APP_URL=https://gamechanger-zeta.vercel.app/
            EOF
            sed -i 's/^[ \t]*//' .env

            echo "📦 Установка зависимостей Node.js..."
            npm install
            echo "🔨 Сборка проекта TypeScript..."
            npm run build

            APP_NAME="${{ secrets.PM2_APP_NAME || 'bot' }}"
            echo "📋 Текущие процессы PM2:"
            pm2 list || true

            echo "🧹 Очистка старых/дублирующих процессов PM2..."
            pm2 delete all || true

            echo "🚀 Запуск чистого процесса $APP_NAME..."
            pm2 start src/index.js --name "$APP_NAME"
            pm2 save

            sleep 4
            echo "📄 Логи запуска бота:"
            pm2 logs "$APP_NAME" --lines 30 --nostream || true

            echo "📋 Итоговый статус PM2:"
            pm2 list

            echo "✅ Бэкенд успешно задеплоен и перезапущен!"
